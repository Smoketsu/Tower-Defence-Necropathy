; Necropathy: Gravewatch export presets (Godot 4.3), copied from Necropathy's
; Web preset (renumbered preset.0). preset.0 = Web (no-threads browser build:
; index.html + .js + .wasm + .pck, any static host). After exporting, always run
; `python3 tools/patch_web_audio.py build/web/index.js` (it also runs the GL patch).
[preset.0]

; Web build (GDD §15.0 "Web build"): a no-threads Godot 4.3 Web export, so it
; needs no SharedArrayBuffer / cross-origin isolation (COOP / COEP) headers and
; runs from any static host (GitHub Pages, `python3 -m http.server`).
; Uses the official web_nothreads_release.zip / web_nothreads_debug.zip templates.
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/*.txt"
exclude_filter="docs/*, .github/*, assets/audio/music/*"
; export_path: index.html so any static host serves the game at the folder's URL.
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; custom_template/*: empty = use the official export templates.
custom_template/debug=""
custom_template/release=""
; variant/extensions_support: false = no GDExtension support (none used; smaller build).
variant/extensions_support=false
; variant/thread_support: false = the no-threads build (no SharedArrayBuffer,
; no COOP / COEP headers; WorkerThreadPool tasks run on the main thread).
variant/thread_support=false
; vram_texture_compression/*: S3TC / BPTC only. Every texture imports lossless
; (compress/mode=0, pixel art), so phones need no ETC2 / ASTC variants.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
; html/export_icon: use the project icon (assets/ui/icon.png) as the page's favicon.
html/export_icon=true
; html/custom_html_shell: web/mobile_shell.html = the stock Godot page (loading
; bar, error box) plus the phone / tablet support: mobile viewport, no zoom or
; scroll bounce, audio unlock on the first tap, landscape lock in fullscreen
; (GDD §15.0 "Mobile browser support"). head_include: nothing extra.
html/custom_html_shell="res://web/mobile_shell.html"
html/head_include=""
; html/canvas_resize_policy: 0 = none: the page (web/mobile_shell.html fitCanvas())
; sizes the canvas to the screen's safe area and Godot follows it (GDD 15.0 "Home
; Screen touch offset"); the project's canvas_items / expand stretch then scales the
; 1280x720 view.
html/canvas_resize_policy=0
; html/focus_canvas_on_start: give the canvas keyboard focus on load.
html/focus_canvas_on_start=true
; html/experimental_virtual_keyboard: off (the game has no text entry).
html/experimental_virtual_keyboard=false
; progressive_web_app/*: no PWA (it would also add the COOP / COEP service worker).
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

